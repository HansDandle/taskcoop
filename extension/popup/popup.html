<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaskCoop Lead Finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo">task<span class="accent">.coop</span></span>
    <span class="tagline">Lead Finder</span>
  </header>

  <div class="filters">
    <button class="filter active" data-platform="all">All</button>
    <button class="filter" data-platform="nextdoor">Nextdoor</button>
    <button class="filter" data-platform="facebook">Facebook</button>
    <button class="filter" data-platform="craigslist">Craigslist</button>
    <button class="filter" data-platform="reddit">Reddit</button>
  </div>

  <div id="leads-container">
    <div id="empty" class="empty hidden">
      <p>No leads yet.</p>
      <p class="empty-sub">Browse Nextdoor, Facebook Groups, Craigslist, or Reddit and relevant posts will appear here automatically.</p>
    </div>
    <ul id="leads-list"></ul>
  </div>

  <footer>
    <a href="https://taskcoop.org/nextdoor" target="_blank">Browse TaskCoop feed</a>
    <button id="clear-btn">Clear all</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
